name: Release

on:
  push:
    tags:
      - 'v*'

# Never cancel a release in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Build and publish Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLATYPUS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/platypus.keystore"

      - name: Build signed APK and AAB
        env:
          PLATYPUS_KEYSTORE_FILE: ${{ runner.temp }}/platypus.keystore
          PLATYPUS_KEYSTORE_PASSWORD: ${{ secrets.PLATYPUS_KEYSTORE_PASSWORD }}
          PLATYPUS_KEY_ALIAS: ${{ secrets.PLATYPUS_KEY_ALIAS }}
          PLATYPUS_KEY_PASSWORD: ${{ secrets.PLATYPUS_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon

      - name: Publish artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: true
